<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Margin</title>
  <script src="/theme-init.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1e1f22">
  <script type="module" src="/main.js"></script>
</head>
<body class="app">
  <header class="topbar">
    <button type="button" id="new-doc">New</button>
    <button type="button" id="toggle-outline" aria-expanded="true" aria-controls="outline" title="Show or hide the outline">Outline</button>
    <div class="menu" id="doclist-menu">
      <button type="button" id="toggle-doclist" aria-expanded="false" aria-controls="doclist">Documents</button>
      <div id="doclist" class="doclist" role="group" aria-label="Documents" hidden></div>
    </div>
    <div class="menu" id="export-wrap" hidden>
      <button type="button" id="toggle-export" aria-expanded="false" aria-controls="export-menu">Export</button>
      <div id="export-menu" class="menu-list menu-start" role="group" aria-label="Export formats" hidden></div>
    </div>
    <button type="button" id="find">Find</button>
    <button type="button" id="mode-toggle" aria-pressed="true" title="Switch Markdown between Visual and Raw" hidden>Visual</button>
    <span class="spacer"></span>
    <button type="button" id="theme-toggle"></button>
    <div class="menu">
      <button type="button" id="account-button" aria-expanded="false" aria-controls="account-menu">Account</button>
      <div id="account-menu" class="menu-list" hidden>
        <button type="button" id="settings">Settings</button>
        <button type="button" id="change-password">Change password</button>
        <button type="button" id="logout">Sign out</button>
      </div>
    </div>
  </header>
  <div class="workspace">
    <aside id="outline" class="outline-panel" aria-label="Outline">
      <h2>Outline</h2>
      <div id="outline-body"></div>
    </aside>
    <main class="editor-pane">
      <div id="tabstrip" class="tabstrip" role="tablist" aria-label="Open documents"></div>
      <div id="md-toolbar" class="md-toolbar" role="toolbar" aria-label="Formatting" hidden></div>
      <div id="editor" class="editor"></div>
      <div id="empty-state" class="empty-state" hidden>
        <p>No document is open.</p>
        <div class="empty-actions">
          <button type="button" id="empty-new" class="primary">New document</button>
          <button type="button" id="empty-list">Open document list</button>
        </div>
      </div>
    </main>
  </div>
  <footer class="statusbar">
    <span id="save-status" aria-live="polite"></span>
    <span id="selection-counts" hidden></span>
    <span id="counts"></span>
    <button type="button" id="count-syntax" aria-pressed="false" title="Count Markdown syntax too" hidden>Count syntax</button>
    <span id="language-slot"></span>
    <span id="status-message" role="status"></span>
  </footer>
  <div id="drop-overlay" class="drop-overlay" hidden>
    <p>Drop .md, .txt or .html files to open them</p>
  </div>
</body>
</html>
